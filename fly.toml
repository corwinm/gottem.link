# fly.toml app configuration file generated for gottem-link on 2025-03-10T08:29:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gottem-link'
primary_region = 'sjc'

[mounts]
  source = "litefs"
  destination = "/var/lib/litefs"

[build]
  [build.args]
    GO_VERSION = '1.27.0'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/.well-known/readyz'
    timeout = '2s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
